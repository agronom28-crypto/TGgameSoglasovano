<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Уровень 2 — Собеседование</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="../leaderboard.css">
  <script src="../app-config.js"></script>
  <script src="../progress.js"></script>
  <script async src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    #bgVideo {
      position: fixed; inset: 0; z-index: 0;
      width: 100%; height: 100%;
      object-fit: cover; pointer-events: none;
    }
    #resultScreen, #quizScreen { position: relative; z-index: 1; }
    .btn-next {
      background: #4CAF50; color: #fff; border: none;
      border-radius: 12px; padding: 14px 28px;
      font-size: 17px; font-weight: bold; cursor: pointer; margin-top: 8px;
    }
    .btn-next:hover { background: #43a047; }
  </style>
</head>
<body>

<video id="bgVideo" autoplay loop muted playsinline preload="auto">
  <source src="../Pictures/Level2_VideoFon_QUIZ.mp4" type="video/mp4">
</video>

<div id="resultScreen">
  <div id="resultCard">
    <div id="resultEmoji">🎉</div>
    <div id="resultTitle">Собеседование завершено!</div>
    <div id="resultScore"></div>
    <div id="resultComment"></div>

    <!-- Рейтинг -->
    <div class="leaderboard-wrap">
      <h3>🏆 Топ-5 (ответы / скорость)</h3>
      <div id="lb2" class="lb-loading">Загрузка...</div>
    </div>

    <div class="btn-row">
      <button class="btn-retry" onclick="location.reload()">🔄 Ещё раз</button>
      <button class="btn-back" onclick="window.location.href='../level-select.html'">← Уровни</button>
    </div>
    <div id="nextLevelRow" style="display:none; margin-top:12px;">
      <button class="btn-next" onclick="window.location.href='../level3/index.html'">Дальше → Уровень 3</button>
    </div>
  </div>
</div>

<div id="quizScreen">
  <div id="quizHeader">
    <div id="hrAvatar">👔</div>
    <div id="hrName">HR Валентина Борисовна</div>
    <div id="quizProgress">Вопрос <span id="qNum">1</span> / 20</div>
  </div>
  <div id="progressBar"><div id="progressFill"></div></div>
  <div id="scoreBar">✅ <span id="scoreCount">0</span> правильных</div>
  <div id="questionBox"><div id="questionText"></div></div>
  <div id="answersBox"></div>
  <div id="feedback"></div>
  <button id="nextBtn" onclick="nextQuestion()" style="display:none">Следующий вопрос →</button>
</div>

<script src="game.js"></script>

</body>
</html>
